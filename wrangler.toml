name = "numbergen-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain (zone pnphoto.co in the naskmill8 Cloudflare account).
routes = [{ pattern = "api.pnphoto.co", custom_domain = true }]
# The workers.dev addresses were turned off on 2026-11-10; only the custom domain serves the API.
workers_dev = false

# Non-secret configuration. For local dev, .dev.vars overrides these values.
# Secrets (SESSION_SECRET, ASSET_SIGNING_SECRET, ADMIN_USERNAME, ADMIN_PASSWORD_HASH, and the Web Push keys
# VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY from `npm run vapid:generate`) are set with `wrangler secret put <NAME>`.
# Optional var VAPID_SUBJECT (a mailto: or https: contact URL for the push services; default https://pnphoto.co).
[vars]
# First origin is used in member links; every listed origin is allowed by CORS.
WEB_URL = "https://pnphoto.co"
COOKIE_SECURE = "true"

# Cloudflare D1 (SQLite). Migrations are the drizzle-kit SQL files in drizzle/:
#   npx wrangler d1 migrations apply numbergen --remote   (or --local for wrangler dev)
[[d1_databases]]
binding = "DB"
database_name = "numbergen"
database_id = "7bbe7862-5da9-414d-89bb-ef8aba43721a"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "numbergen-assets"

[observability]
enabled = true

# Daily reminders ("เวลาลง"): src/lib/reminders.ts runs every minute and sends the Web Push messages that are
# due. It does nothing until VAPID_PUBLIC_KEY and VAPID_PRIVATE_KEY are set.
[triggers]
crons = ["* * * * *"]

# ---------------------------------------------------------------------------------------------
# TEST STACK (`npm run deploy:test`): a second Worker on api-test.pnphoto.co (web: pnphoto.co/testsite) for trying new code
# before it goes live. It uses the SAME D1 database and R2 bucket as production, so everything
# done there is real data, and migrations must already be applied (`npm run db:migrate:remote`).
# Bindings and vars are not inherited by an environment, so they are repeated here.
# Secrets are per Worker: set each one again with `wrangler secret put <NAME> --env test`.
[env.test]
name = "numbergen-api-test"
routes = [{ pattern = "api-test.pnphoto.co", custom_domain = true }]
workers_dev = false

[env.test.vars]
# The test site is served at https://pnphoto.co/testsite. The first entry is used for member
# links; the second is the browser origin that CORS and the CSRF guard must allow.
WEB_URL = "https://pnphoto.co/testsite,https://pnphoto.co"
# Marks this Worker as the test stack: the admin switch "เว็บทดสอบ" (site_settings testsite_enabled)
# can turn it off (src/middleware/testStack.ts). Must be the quoted string "true". Never set on production.
TEST_STACK = "true"
COOKIE_SECURE = "true"

[[env.test.d1_databases]]
binding = "DB"
database_name = "numbergen"
database_id = "7bbe7862-5da9-414d-89bb-ef8aba43721a"
migrations_dir = "drizzle"

[[env.test.r2_buckets]]
binding = "ASSETS"
bucket_name = "numbergen-assets"

[env.test.observability]
enabled = true

# No reminder schedule on the test Worker: only production sends the daily push messages.
[env.test.triggers]
crons = []
