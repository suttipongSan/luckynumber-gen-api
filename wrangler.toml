name = "numbergen-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain (zone pnphoto.co in the naskmill8 Cloudflare account).
routes = [{ pattern = "api.pnphoto.co", custom_domain = true }]
# The workers.dev addresses were turned off on 2026-11-10; only the custom domain serves the API.
workers_dev = false

# Non-secret configuration. For local dev, .dev.vars overrides these values.
# Secrets (SESSION_SECRET, ASSET_SIGNING_SECRET, ADMIN_USERNAME, ADMIN_PASSWORD_HASH, and the Web Push keys
# VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY from `npm run vapid:generate`) are set with `wrangler secret put <NAME>`.
# Optional var VAPID_SUBJECT (a mailto: or https: contact URL for the push services; default https://pnphoto.co).
# Optional secret RESULTS_API_KEY: the key of the results robot, sent as the X-API-Key header of PUT /results
# (a long random string, e.g. `node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"`).
# Without it the key is refused and only a signed-in admin can write results. The test Worker needs its own
# copy: `wrangler secret put RESULTS_API_KEY --env test` (see [env.test] below).
[vars]
# First origin is used in member links; every listed origin is allowed by CORS.
WEB_URL = "https://pnphoto.co"
COOKIE_SECURE = "true"

# Cloudflare D1 (SQLite). Migrations are the drizzle-kit SQL files in drizzle/:
#   npx wrangler d1 migrations apply numbergen --remote   (or --local for wrangler dev)
[[d1_databases]]
binding = "DB"
database_name = "numbergen"
database_id = "7bbe7862-5da9-414d-89bb-ef8aba43721a"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "numbergen-assets"

# The snapshot files of the OFFICIAL lottery results that the free public results site reads (src/lib/publicSnapshot.ts,
# src/lib/publicPublish.ts). Public data only, nothing of the members. Create the bucket once before deploying:
#   npx wrangler r2 bucket create pnresult-public
# and serve it on an R2 custom domain (README, "Public results snapshots"). In `wrangler dev` this binding is a local
# simulation, read through GET /public-data/* (only while COOKIE_SECURE is not 'true'). Optional in the code: a Worker
# without it publishes nothing. The test Worker below deliberately has no such binding.
[[r2_buckets]]
binding = "PUBLIC_RESULTS"
bucket_name = "pnresult-public"

[observability]
enabled = true

# Daily reminders ("เวลาลง"): src/lib/reminders.ts runs every minute and sends the Web Push messages that are
# due. It does nothing until VAPID_PUBLIC_KEY and VAPID_PRIVATE_KEY are set. The same trigger also deletes the
# saved draws (member_draws) older than 14 days, once a day in the 03:17 Bangkok minute (src/lib/draws.ts);
# that part needs no secret.
[triggers]
crons = ["* * * * *"]

# ---------------------------------------------------------------------------------------------
# TEST STACK (`npm run deploy:test`): a second Worker on api-test.pnphoto.co (web: pnphoto.co/testsite) for trying new code
# before it goes live. It uses the SAME D1 database and R2 bucket as production, so everything
# done there is real data, and migrations must already be applied (`npm run db:migrate:remote`).
# Bindings and vars are not inherited by an environment, so they are repeated here.
# Secrets are per Worker: set each one again with `wrangler secret put <NAME> --env test`. That includes the
# optional RESULTS_API_KEY (PUT /results): leave it unset here if only an admin should write results through the
# test site, or give it its own key (a result written through either Worker is the same row in the shared D1).
[env.test]
name = "numbergen-api-test"
routes = [{ pattern = "api-test.pnphoto.co", custom_domain = true }]
workers_dev = false

[env.test.vars]
# The test site is served at https://pnphoto.co/testsite. The first entry is used for member
# links; the second is the browser origin that CORS and the CSRF guard must allow.
WEB_URL = "https://pnphoto.co/testsite,https://pnphoto.co"
# Marks this Worker as the test stack: the admin switch "เว็บทดสอบ" (site_settings testsite_enabled)
# can turn it off (src/middleware/testStack.ts). Must be the quoted string "true". Never set on production.
TEST_STACK = "true"
COOKIE_SECURE = "true"

[[env.test.d1_databases]]
binding = "DB"
database_name = "numbergen"
database_id = "7bbe7862-5da9-414d-89bb-ef8aba43721a"
migrations_dir = "drizzle"

[[env.test.r2_buckets]]
binding = "ASSETS"
bucket_name = "numbergen-assets"

# NO PUBLIC_RESULTS binding here, on purpose: this Worker never publishes snapshot files. But the D1 database is shared: a
# result written through this Worker bumps results_version in the shared site_settings, and the live Worker's cron then
# publishes it to the public site. To stop all publishing (for example while testing with fake results) set the
# site_settings switch public_results_enabled to "false" first: PUT /admin/public/enabled {"enabled": false} (README).

[env.test.observability]
enabled = true

# No schedule on the test Worker: only production sends the daily push messages and cleans up the saved draws
# (the table is shared, so the live Worker's trigger cleans it for both).
# TEMPORARY, until the live Worker is deployed with the public results code: the test Worker publishes the
# snapshot files of the public results site (bucket pnresult-public) and has a schedule for that. On the test
# Worker the schedule ONLY publishes (src/index.ts, TEST_STACK): the reminders and the draw clean-up stay with
# production. Remove this binding and set crons = [] again when the live Worker takes over.
[[env.test.r2_buckets]]
binding = "PUBLIC_RESULTS"
bucket_name = "pnresult-public"

[env.test.triggers]
crons = ["* * * * *"]
