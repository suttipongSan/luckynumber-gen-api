name = "numbergen-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain (zone pnphoto.co in the naskmill8 Cloudflare account).
routes = [{ pattern = "api.pnphoto.co", custom_domain = true }]
# The workers.dev addresses were turned off on 2026-11-10; only the custom domain serves the API.
workers_dev = false

# Non-secret configuration. For local dev, .dev.vars overrides these values.
# Secrets (SESSION_SECRET, ASSET_SIGNING_SECRET, ADMIN_USERNAME, ADMIN_PASSWORD_HASH, and the Web Push keys
# VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY from `npm run vapid:generate`) are set with `wrangler secret put <NAME>`.
# Optional var VAPID_SUBJECT (a mailto: or https: contact URL for the push services; default https://pnphoto.co).
[vars]
# First origin is used in member links; every listed origin is allowed by CORS.
WEB_URL = "https://pnphoto.co"
COOKIE_SECURE = "true"

# Cloudflare D1 (SQLite). Migrations are the drizzle-kit SQL files in drizzle/:
#   npx wrangler d1 migrations apply numbergen --remote   (or --local for wrangler dev)
[[d1_databases]]
binding = "DB"
database_name = "numbergen"
database_id = "7bbe7862-5da9-414d-89bb-ef8aba43721a"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "numbergen-assets"

[observability]
enabled = true

# Daily reminders ("เวลาลง"): src/lib/reminders.ts runs every minute and sends the Web Push messages that are
# due. It does nothing until VAPID_PUBLIC_KEY and VAPID_PRIVATE_KEY are set.
[triggers]
crons = ["* * * * *"]
